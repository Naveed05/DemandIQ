[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demandiq"
version = "0.1.0"
description = "Demand forecasting and inventory intelligence for retail analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "streamlit>=1.32", "plotly>=5.18"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
